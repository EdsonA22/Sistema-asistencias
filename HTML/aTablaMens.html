<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla de Asistencias - Admin</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <script type="module" src="../JS/GuardAdm.js"></script>
    <link rel="stylesheet" href="../CSS/admin.css" />
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <i class="bx bx-shield-quarter" style="font-size: 24px"></i>
          </div>
          <div>
            <h1>Administrador</h1>
            <p>Sistema de asistencias</p>
          </div>
        </div>
        <nav class="nav">
          <a href="admin.html"><i class="bx bx-home"></i> Inicio</a>
          <a href="aTabla.html"
            ><i class="bx bx-calendar-check"></i> Asistencias del dia</a
          >
          <a href="aEntrenadores.html"
            ><i class="bx bx-group"></i> Entrenadores</a
          >
          <a href="aCrearUsuar.html"
            ><i class="bx bx-user-plus"></i> Crear usuarios</a
          >
          <a href="aTablaMens.html"
            ><i class="bx bx-calendar-alt"></i> Tabla de asistencias</a
          ><br />
          <a href="index.html"><i class="bx bx-qr"></i>Registro por QR</a>
        </nav>
        <a id="btnCerrarSesion" href="login.html" class="logout"
          ><i class="bx bx-log-out"></i> Cerrar sesión</a
        >
      </aside>

      <main class="main">
        <div class="page-header">
          <div>
            <h2>Bitácora general de asistencias</h2>
            <p class="muted">
              Visualización detallada de registros mensuales del sistema
            </p>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow-x: auto">
          <div
            style="
              margin-bottom: 20px;
              display: flex;
              gap: 15px;
              align-items: center;
              flex-wrap: wrap;
            "
          >
            <div>
              <label for="mesSeleccionado"><b>Mes a evaluar:</b></label>
              <input type="month" id="mesSeleccionado" class="input-form" />
            </div>

            <div>
              <label for="buscadorEntrenadores"
                ><b>Buscar entrenador:</b></label
              >
              <input
                type="text"
                id="buscadorEntrenadores"
                class="input-form"
                placeholder="Escribe un nombre..."
              />
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Nombre del Entrenador</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <script type="module" src="../JS/BitacoraMes.js"></script>
  </body>
</html>
