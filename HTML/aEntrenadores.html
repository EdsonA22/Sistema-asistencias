<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrenadores - Admin</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/admin.css" />
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <i class="bx bx-shield-quarter" style="font-size: 24px"></i>
          </div>
          <div>
            <h1>Administrador</h1>
            <p>Sistema de asistencias</p>
          </div>
        </div>
        <nav class="nav">
          <a href="admin.html"><i class="bx bx-home"></i> Inicio</a>
          <a href="aEntrenadores.html" class="active"
            ><i class="bx bx-group"></i> Entrenadores</a
          >
          <a href="aCrearUsuar.html"
            ><i class="bx bx-user-plus"></i> Crear usuarios</a
          >
          <a href="aTabla.html"
            ><i class="bx bx-table"></i> Tabla de asistencias</a
          >
        </nav>
        <a href="login.html" class="logout"
          ><i class="bx bx-log-out"></i> Cerrar sesión</a
        >
      </aside>

      <main class="main">
        <div class="page-header">
          <div>
            <h2>Directorio de entrenadores</h2>
            <p class="muted">
              Lista y estado administrativo del personal deportivo
            </p>
          </div>
          <label for="rol">Filtrar por rol:</label>
          <select id="rol">
            <option value="entrenador">Entrenador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="student-list">
          <div class="student-row">
            <div>
              <strong>Prof. Juan Pérez</strong>
              <p class="muted">Rol: Entrenador</p>
            </div>
            <div>
              <span class="badge">Activo</span>
              <button class="secondary-btn">
                <i class="bx bx-edit-alt"></i> Gestionar
              </button>
            </div>
          </div>

          <div class="student-row">
            <div>
              <strong>Prof. Juan Pérez 2</strong>
              <p class="muted">Rol: administrador</p>
            </div>
            <div>
              <span class="badge">Activo</span>
              <button class="secondary-btn">
                <i class="bx bx-edit-alt"></i> Gestionar
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
