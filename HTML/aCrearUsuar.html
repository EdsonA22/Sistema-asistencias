<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear usuarios - Admin</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/admin.css" />
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <i class="bx bx-shield-quarter" style="font-size: 24px"></i>
          </div>
          <div>
            <h1>Administrador</h1>
            <p>Sistema de asistencias</p>
          </div>
        </div>
        <nav class="nav">
          <a href="admin.html"><i class="bx bx-home"></i> Inicio</a>
          <a href="aTabla.html"
            ><i class="bx bx-calendar-check"></i> Asistencias del dia</a
          >
          <a href="aEntrenadores.html"
            ><i class="bx bx-group"></i> Entrenadores</a
          >
          <a href="aCrearUsuar.html"
            ><i class="bx bx-user-plus"></i> Crear usuarios</a
          >
          <a href="aTablaMens.html"
            ><i class="bx bx-calendar-alt"></i> Tabla de asistencias</a
          ><br />
          <a href="index.html"><i class="bx bx-qr"></i>Registro por QR</a>
        </nav>
        <a id="btnCerrarSesion" href="login.html" class="logout"
          ><i class="bx bx-door-open-alt"></i> Cerrar sesión</a
        >
      </aside>

      <main class="main">
        <div class="page-header">
          <div>
            <h2>Crear nuevo usuario</h2>
            <p class="muted">
              Registra cuentas de administradores o entrenadores.
            </p>
          </div>
        </div>

        <div class="grid two">
          <div class="card">
            <form id="formCrearUsuario">
              <div>
                <label for="nombre">Nombre completo</label>
                <input
                  type="text"
                  id="nombre"
                  placeholder="Nombre completo del usuario"
                  required
                />
              </div>
              <div>
                <label for="correo">Correo electrónico</label>
                <input
                  type="email"
                  id="correo"
                  placeholder="correo@ejemplo.com"
                  required
                />
              </div>
              <div>
                <label for="password">Contraseña provisional</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required />
              </div>
              <div>
                <div>
                <label for="rol">Rol en el sistema</label>
                <select id="rol">
                  <option value="entrenador">Entrenador (a)</option>
                  <option value="admin">Usuario</option>
                </select>
              </div><br>
              
              <div>
                <label for="categoria">Categoría Deportiva</label>
                <select id="categoria">
                  <option value="General">General</option>
                  <option value="Futbol">Fútbol</option>
                  <option value="Basquetbol">Básquetbol</option>
                </select>
              </div><br>
              <button type="submit" class="btn">Registrar usuario</button>
            </form>
          </div>
            </div>
          </div>
        </div>
      </main>
    </div>

<script type="module" src="../JS/CrearUsuarios.js"></script>
  </body>
</html>
