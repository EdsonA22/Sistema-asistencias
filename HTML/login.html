<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia Baloncesto UV</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/login.css" />
  </head>

  <body>
    <div class="wrapper">
      <form id="formLogin">
        <h1>Iniciar sesión</h1>
        <img src="../Imagenes/Logo halcones.png" class="logo" />

        <div class="textfield">
          <input
            type="email"
            id="loginCorreo"
            placeholder="Correo electrónico"
            required
          />
          <i class="bxr bx-user-hexagon"></i>
        </div>
        <div class="textfield">
          <input
            type="password"
            id="loginPassword"
            placeholder="Contraseña"
            required
          />
          <i class="bxr bx-lock"></i>
        </div>

        <div class="recordar">
          <label><input type="checkbox" />Recordarme</label>
        </div>

        <button type="submit" class="btn">Ingresar</button>
      </form>

      <script type="module" src="../JS/Login.js"></script>
    </div>
  </body>
</html>
